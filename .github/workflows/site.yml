name: Обновление данных и публикация сайта

on:
  schedule:
    - cron: "40 5 * * *"   # каждый день в 08:40 по Минску
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Проверить, подключён ли Cloudflare (для чата)
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then echo "on=yes" >> "$GITHUB_OUTPUT"; else echo "on=no" >> "$GITHUB_OUTPUT"; fi

      - name: Развернуть чат-помощника
        id: chat
        if: steps.cf.outputs.on == 'yes'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Записать адрес чата в данные
        if: steps.cf.outputs.on == 'yes' && steps.chat.outcome == 'success'
        env:
          OUT: ${{ steps.chat.outputs.command-output }}
          URL: ${{ steps.chat.outputs.deployment-url }}
        run: node scripts/set-chat.mjs

      - name: Обновить объявления (Kufar)
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/update.mjs

      - name: Сохранить изменения данных
        run: |
          git config user.name "rav4-bumper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Обновление данных $(date -u +%F)"
            git pull --rebase --autostash || true
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
