<title>Бампер для RAV4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Mono&family=Russo+One&display=swap">
<style>
/* Layout: одна узкая колонка; «дорога» из 7 остановок, каждая открывает свой экран */
:root{
  --bg:#ECF0F3; --surface:#FFFFFF; --surface-2:#F4F7F9; --ink:#14202A; --muted:#55636F; --line:#D1D9DF;
  --road:#34414B; --mark:#F2C230; --accent:#1F5BB5; --accent-ink:#FFFFFF; --accent-soft:#E2EBF8;
  --go:#1C7F45; --go-soft:#E0F2E7; --stop:#BD3A2C; --stop-soft:#F8E3DF; --wait:#9C5F00; --wait-soft:#FAEED6;
  --on-strong:#FFFFFF; --on-mark:#14202A;
  --font-display:"Russo One","Arial Black",system-ui,sans-serif;
  --font-body:"Golos Text","Segoe UI",Roboto,system-ui,sans-serif;
  --font-mono:"PT Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161C; --surface:#18222A; --surface-2:#1F2A33; --ink:#E7EDF1; --muted:#A3B0BA; --line:#2D3A44;
    --road:#3D4B56; --mark:#E8B923; --accent:#69A3FF; --accent-ink:#09121F; --accent-soft:#1B2D45;
    --go:#4CC781; --go-soft:#153021; --stop:#FF7A6B; --stop-soft:#3A1F1B; --wait:#F2AF48; --wait-soft:#382A12;
    --on-strong:#0B1418; --on-mark:#14202A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#18222A; --surface-2:#1F2A33; --ink:#E7EDF1; --muted:#A3B0BA; --line:#2D3A44;
  --road:#3D4B56; --mark:#E8B923; --accent:#69A3FF; --accent-ink:#09121F; --accent-soft:#1B2D45;
  --go:#4CC781; --go-soft:#153021; --stop:#FF7A6B; --stop-soft:#3A1F1B; --wait:#F2AF48; --wait-soft:#382A12;
  --on-strong:#0B1418; --on-mark:#14202A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:18px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px 96px;
}
.wrap{max-width:600px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
h1,h2,h3{margin:0; text-wrap:balance; line-height:1.15}
h1{font-family:var(--font-display); font-weight:400; font-size:34px; letter-spacing:.01em}
h2{font-family:var(--font-display); font-weight:400; font-size:27px}
h3{font-size:20px; font-weight:700}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:15px}
.mono{font-family:var(--font-mono)}
.stack{display:flex; flex-direction:column; gap:12px}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; display:flex; flex-direction:column; gap:12px; min-width:0}
.card.soft{background:var(--surface-2)}
.card.accent{border:2px solid var(--accent)}
.eyebrow{font-size:14px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

/* Кнопки */
.btn{
  -webkit-appearance:none; appearance:none; border:0; cursor:pointer;
  min-height:54px; padding:12px 20px; border-radius:12px;
  font:600 18px/1.2 var(--font-body); text-decoration:none; text-align:center;
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  background:var(--accent); color:var(--accent-ink);
}
.btn.block{width:100%}
.btn.ghost{background:transparent; color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent)}
.btn.quiet{background:var(--surface-2); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); min-height:46px; font-size:16px; padding:10px 14px}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--mark); outline-offset:2px}
.btn svg{flex:none}

/* Варианты ответа */
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:10px}
.opt{
  -webkit-appearance:none; appearance:none; cursor:pointer; min-height:54px; padding:10px 8px; border-radius:12px;
  font:600 17px/1.2 var(--font-body); color:var(--ink); background:var(--surface); box-shadow:inset 0 0 0 2px var(--line); border:0;
}
.opt[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); box-shadow:none}
.opt.yes[aria-pressed="true"]{background:var(--go); color:var(--on-strong)}
.opt.no[aria-pressed="true"]{background:var(--stop); color:var(--on-strong)}
.opt.later[aria-pressed="true"]{background:var(--wait); color:var(--on-strong)}

/* Шапка и прогресс */
.hero{display:flex; flex-direction:column; gap:10px}
.progress{display:flex; flex-direction:column; gap:8px}
.bar{height:14px; border-radius:999px; background:var(--line); overflow:hidden}
.bar > i{display:block; height:100%; background:var(--go); border-radius:999px; transition:width .4s ease}
.stars{display:flex; gap:4px; color:var(--mark)}
.stars .off{color:var(--line)}
.photo{display:grid; grid-template-columns:120px 1fr; gap:14px; align-items:center}
.photo img{width:120px; height:116px; object-fit:cover; border-radius:12px; display:block}
@media (max-width:360px){.photo{grid-template-columns:1fr}.photo img{width:100%; height:auto}}

/* Дорога */
.road{position:relative; display:flex; flex-direction:column; gap:12px; padding-left:62px}
.road::before{content:""; position:absolute; left:10px; top:8px; bottom:8px; width:34px; border-radius:17px; background:var(--road)}
.road::after{content:""; position:absolute; left:26px; top:22px; bottom:22px; width:2px;
  background:repeating-linear-gradient(to bottom, var(--mark) 0 12px, transparent 12px 24px)}
.stop{position:relative}
.stop .btn-step{
  -webkit-appearance:none; appearance:none; border:0; cursor:pointer; width:100%; text-align:left;
  background:var(--surface); color:var(--ink); border-radius:var(--r); box-shadow:inset 0 0 0 1px var(--line);
  padding:14px 16px; display:flex; flex-direction:column; gap:2px; font:inherit; min-height:64px;
}
.stop.current .btn-step{box-shadow:inset 0 0 0 2px var(--accent); background:var(--accent-soft)}
.stop .dot{
  position:absolute; left:-56px; top:50%; transform:translateY(-50%); z-index:1;
  width:42px; height:42px; border-radius:50%; display:grid; place-items:center;
  background:var(--surface); color:var(--ink); box-shadow:0 0 0 3px var(--road);
  font-family:var(--font-display); font-size:18px;
}
.stop.done .dot{background:var(--go); color:var(--on-strong)}
.stop.current .dot{background:var(--mark); color:var(--on-mark)}
.stop .st{font-size:15px; color:var(--muted)}
.stop.done .st{color:var(--go)}
@media (prefers-reduced-motion:no-preference){
  .stop.current .dot svg{animation:hop 1.6s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
}

/* Экран шага */
.topbar{display:flex; justify-content:space-between; align-items:center; gap:10px}
.lead{font-size:19px}
.navrow{display:grid; grid-template-columns:1fr 2fr; gap:10px}
.note{border-radius:12px; padding:12px 14px; font-size:16px; display:flex; gap:10px; align-items:flex-start}
.note.warn{background:var(--wait-soft); color:var(--ink); box-shadow:inset 3px 0 0 var(--wait)}
.note.good{background:var(--go-soft); color:var(--ink); box-shadow:inset 3px 0 0 var(--go)}
.note.bad{background:var(--stop-soft); color:var(--ink); box-shadow:inset 3px 0 0 var(--stop)}
.note.info{background:var(--accent-soft); color:var(--ink); box-shadow:inset 3px 0 0 var(--accent)}
ol.plain,ul.plain{margin:0; padding-left:22px; display:flex; flex-direction:column; gap:6px}
.check{display:flex; gap:10px; align-items:flex-start}
.check input{width:24px; height:24px; margin-top:2px; flex:none; accent-color:var(--go)}
label.field{display:flex; flex-direction:column; gap:6px; font-weight:600; font-size:16px}
input[type=text],input[type=number],input[type=tel],input[type=url],select{
  font:500 18px/1.2 var(--font-body); color:var(--ink); background:var(--surface);
  border:2px solid var(--line); border-radius:10px; padding:12px; min-height:52px; width:100%; box-sizing:border-box;
}
input.code{font-family:var(--font-mono); font-size:22px; letter-spacing:.06em; text-transform:uppercase}
.figure{background:var(--surface-2); border-radius:12px; padding:10px; overflow-x:auto}
.figure svg{display:block; width:100%; height:auto; max-width:520px; margin:0 auto}
.svg-t{font-family:var(--font-mono); font-size:13px; fill:var(--muted)}
.svg-b{font-family:var(--font-mono); font-size:19px; fill:var(--ink); font-weight:700}
.svg-l{font-family:var(--font-display); font-size:16px; fill:var(--accent-ink)}

/* Карточки продавцов */
.chip{display:inline-flex; align-self:flex-start; align-items:center; gap:6px; border-radius:999px; padding:4px 10px; font-size:14px; font-weight:600; line-height:1.2}
.g-asm{background:var(--go-soft); color:var(--go)}
.g-cov{background:var(--accent-soft); color:var(--accent)}
.g-new{background:var(--wait-soft); color:var(--wait)}
.g-don{background:var(--surface-2); color:var(--muted); box-shadow:inset 0 0 0 1px var(--line)}
.offer{gap:10px}
.offer.st-yes{box-shadow:inset 0 0 0 2px var(--go)}
.offer.st-no{opacity:.72}
.offer-head{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.offer-head > div{min-width:0}
.price{font-family:var(--font-display); font-size:26px; white-space:nowrap; text-align:right; line-height:1.1}
.price small{display:block; font-family:var(--font-body); font-size:14px; color:var(--muted); font-weight:500}
.phones{display:flex; flex-direction:column; gap:8px}
.phone{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; background:var(--surface-2); border-radius:12px; padding:10px 12px}
.phone .num{font-family:var(--font-mono); font-size:23px; font-weight:700; color:var(--ink); text-decoration:none; user-select:all; -webkit-user-select:all; letter-spacing:.01em}
.phone .lbl{font-size:14px; color:var(--muted); flex-basis:100%}
.phone .acts{display:flex; gap:8px; margin-left:auto}
.say{font-size:16px; background:var(--accent-soft); border-radius:10px; padding:8px 12px}
.meta{font-size:15px; color:var(--muted); display:flex; flex-direction:column; gap:2px}
details.more summary{cursor:pointer; color:var(--accent); font-weight:600; font-size:16px; padding:6px 0}
details.more[open] summary{margin-bottom:6px}
.result{border-top:1px dashed var(--line); padding-top:12px; display:flex; flex-direction:column; gap:10px}
.result .opts{grid-template-columns:1fr 1fr}
.result .opt.later{grid-column:1 / -1}
.flags{display:flex; flex-direction:column; gap:6px}
.total{display:flex; justify-content:space-between; gap:10px; align-items:baseline; font-weight:700}
.total b{font-family:var(--font-display); font-weight:400; font-size:22px; white-space:nowrap}
.tabs{display:flex; gap:8px; flex-wrap:wrap}

/* Сравнение */
.cmp{display:flex; flex-direction:column; gap:10px}
.cmp-item{display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center}
.cmp-item .sum{font-family:var(--font-display); font-size:24px; white-space:nowrap; text-align:right}
.cmp-item .break{grid-column:1 / -1; font-size:15px; color:var(--muted); font-variant-numeric:tabular-nums}
.cmp-item.chosen{box-shadow:inset 0 0 0 3px var(--go)}
.badge{display:inline-block; background:var(--mark); color:var(--on-mark); border-radius:6px; padding:2px 8px; font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase}
.costs{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}

/* Тост и конфетти */
.toast{position:fixed; left:0; right:0; margin-inline:auto; width:fit-content; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); z-index:20;
  background:var(--ink); color:var(--bg); border-radius:12px; padding:12px 18px; font-weight:600; max-width:calc(100% - 32px); box-shadow:0 8px 24px rgba(0,0,0,.25)}
#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:30}
.foot{font-size:15px; color:var(--muted); display:flex; flex-direction:column; gap:10px; align-items:flex-start}
.linkbtn{background:none; border:0; padding:0; font:inherit; color:var(--accent); text-decoration:underline; cursor:pointer}
.big-win{font-family:var(--font-display); font-size:44px; line-height:1.05}

/* Чат */
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.chat-fab{position:fixed; z-index:15; right:max(16px, env(safe-area-inset-right, 0px)); bottom:calc(16px + env(safe-area-inset-bottom, 0px)); box-shadow:0 8px 24px rgba(0,0,0,.25); border-radius:999px}
.chat{position:fixed; z-index:25; left:max(10px, env(safe-area-inset-left, 0px)); right:max(10px, env(safe-area-inset-right, 0px)); bottom:calc(10px + env(safe-area-inset-bottom, 0px));
  max-width:520px; margin-left:auto; height:min(80vh, 640px); background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:16px;
  box-shadow:0 14px 44px rgba(0,0,0,.3); display:flex; flex-direction:column; overflow:hidden}
.chat-head{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line)}
.chat-head .row{flex-wrap:nowrap}
.chat-head .btn{min-height:40px; padding:6px 10px; font-size:15px}
.chat-log{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px}
.msg{max-width:88%; padding:10px 12px; border-radius:14px; font-size:17px; line-height:1.4; overflow-wrap:anywhere}
.msg.me{align-self:flex-end; background:var(--accent); color:var(--accent-ink)}
.msg.bot{align-self:flex-start; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line)}
.chat-form{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line)}
.chat-form input{flex:1; min-width:0}
.chat-note{padding:0 12px 10px}
</style>

<div class="wrap" id="app" lang="ru"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<button id="chat-open" class="btn chat-fab" hidden>Спросить помощника</button>
<section id="chat" class="chat" hidden aria-label="Помощник по бамперу">
  <div class="chat-head"><strong>Помощник по бамперу</strong><span class="row" style="gap:6px"><button class="btn quiet" id="chat-clear" type="button">Очистить</button><button class="btn quiet" id="chat-close" type="button">Закрыть</button></span></div>
  <div id="chat-log" class="chat-log" aria-live="polite"></div>
  <form id="chat-form" class="chat-form"><label for="chat-input" class="sr">Вопрос</label><input id="chat-input" type="text" placeholder="Напишите вопрос…" autocomplete="off"><button class="btn" type="submit">Отправить</button></form>
  <p class="small muted chat-note">Помощник может ошибаться. Цены и наличие уточняйте по телефону.</p>
</section>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
'use strict';

/* ---------- Данные (проверены 16.10.2026) ---------- */

let DATA = {offers:[], fresh:[], vin:{}};

const KEY = 'rav4-bumper-quest-v1';
const fresh = () => ({v:1, screen:'home', done:{}, kasko:null, paint:VIN.paint || '', washers:VIN.washers || null, pdc:VIN.pdc || null, fog:VIN.fog || null, partno:VIN.partno || '',
  checks:{}, route:null, calls:{}, custom:[], costs:{paint:500, install:60, extras:150}, choice:null, finished:false, filter:'mine'});

function load(){

function toast(msg){

function copyText(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => toast('Скопировано'), () => fallbackCopy(text));
      return;
    }
  }catch(e){}
  fallbackCopy(text);
}
function fallbackCopy(text){
  try{
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove();
    toast(ok ? 'Скопировано' : 'Не получилось скопировать — выделите текст пальцем и скопируйте');
  }catch(e){ toast('Не получилось скопировать — выделите текст пальцем и скопируйте'); }

function issues(o){
  const out = [], h = o.holes || {};
  if(S.washers === 'no' && h.washers === true) out.push({t:'Есть прорези под омыватели фар, а у вас их нет — их нужно заделать', cost:80});
  if(S.washers === 'yes' && h.washers === false) out.push({t:'Нет прорезей под омыватели фар — мастеру нужно прорезать', cost:40});
  if(S.pdc === 'no' && h.pdc === true) out.push({t:'Есть отверстия под парктроники, а у вас их нет — их нужно заделать', cost:80});
  if(S.pdc === 'yes' && h.pdc === false) out.push({t: o.pricePdc ? ('Вам нужна ' + o.pdcNote + ' (посчитано по ней)') : 'Нет отверстий под парктроники — спросите версию с отверстиями', cost:0});
  if(S.fog === 'grilles' && o.fogLamps) out.push({t:'В комплекте противотуманки, а у вас решётки — поставьте свои решётки или попросите цену без фар', cost:0});
  return out;
}
function asks(o){
  const a = [], h = o.holes || {};
  if(o.group === 'donor') return a;
  if(h.washers == null && S.washers !== 'unknown') a.push('есть ли прорези под омыватели фар');
  if(h.pdc == null && S.pdc !== 'unknown') a.push('есть ли отверстия под парктроники');
  if(o.group !== 'copy' && !o.mustPaint) a.push('какой код краски' + (S.paint ? ' (у вас ' + S.paint + ')' : ''));
  return a;
}
function basePrice(o){
  const c = S.calls[o.id];
  if(c && c.status === 'yes' && +c.price > 0) return +c.price;
  if(S.pdc === 'yes' && o.pricePdc) return o.pricePdc;
  return o.price;
}
function total(o){
  const p = basePrice(o);
  if(!(p > 0)) return null;
  const c = S.calls[o.id] || {}, k = S.costs;
  let pMin, pMax;
  if(o.group === 'copy' || o.mustPaint || c.color === 'nomatch'){ pMin = pMax = +k.paint || 0; }
  else if(c.color === 'match'){ pMin = pMax = 0; }
  else { pMin = 0; pMax = +k.paint || 0; }
  const extras = o.group === 'assembly' ? 20 : (+k.extras || 0);
  const fix = issues(o).reduce((s, i) => s + i.cost, 0);
  const ship = +o.shipping || 0;
  const base = p + (+k.install || 0) + extras + fix + ship;
  return {price:p, pMin, pMax, install:+k.install || 0, extras, fix, ship, min:base + pMin, max:base + pMax};
}
const rangeTxt = t => t.min === t.max ? fmt(t.min) : fmt(t.min) + '–' + fmt(t.max);

const statusTxt = v => ({yes:'есть', no:'нет', later:'перезвонят'})[v] || '';
const colorTxt = v => ({match:'совпадает', nomatch:'не совпадает', unknown:'не знаю'})[v] || '';
function report(){
  const L = [];

  const called = allOffers().filter(o => S.calls[o.id] && S.calls[o.id].status);
  if(called.length){
    L.push('Звонки:');
    called.forEach(o => {
      const c = S.calls[o.id];
      L.push((c.status === 'yes' ? '✅ ' : c.status === 'no' ? '❌ ' : '⏳ ') + o.seller + ' — ' + statusTxt(c.status) +
        (c.status === 'yes' && basePrice(o) > 0 ? ', ' + fmt(basePrice(o)) + ' BYN' : '') + (c.color ? ', цвет: ' + colorTxt(c.color) : '') + (c.note ? '. ' + c.note : ''));

}

function routeRange(g){
  const ts = OFFERS.filter(o => o.group === g).map(total).filter(Boolean);
  if(!ts.length) return null;
  return {min:Math.min.apply(null, ts.map(t => t.min)), max:Math.max.apply(null, ts.map(t => t.max))};
}
function s3(){
  let b = '<div class="stack">';
  ROUTES.forEach(r => {
    const rg = routeRange(r.id), on = S.route === r.id;
    b += '<div class="card' + (on ? ' accent' : '') + '"><div class="offer-head"><div><span class="chip ' + GROUPS[r.id].cls + '">' + esc(GROUPS[r.id].label) + '</span><h3 style="margin-top:8px">' + esc(r.title) + '</h3></div>' +
      (rg ? '<div class="price">' + fmt(rg.min) + '–' + fmt(rg.max) + '<small>BYN всего · ' + usd(rg.min) + '–' + fmt(rg.max / RATE) + '</small></div>' : '') + '</div>' +
      '<p>' + esc(r.what) + '</p><p class="small"><strong>Срок:</strong> ' + esc(r.time) + '</p>' +

function script(){
  let t = 'Здравствуйте! Мне нужен передний бампер на Toyota RAV4 2018 года, рестайлинг, 40 кузов, гибрид.';
  if(S.partno) t += ' Номер детали ' + S.partno + '.';

  const feat = []; if(S.pdc === 'yes') feat.push('под парктроники'); if(S.washers === 'no') feat.push('без омывателей фар');

  let b = VIN.radar ? '<div class="note good">' + I.check + '<span>По VIN у вашей машины есть радар защиты от столкновения — после замены бампера настройка нужна.</span></div>' : '';
  b += '<div class="card"><h3>Нужно ли это вам?</h3><p>Если машина сама держит дистанцию на круизе или пищит перед столкновением — у неё есть радар. После замены бампера его настраивают у дилера.</p>' +
    '<p class="small muted">Запишитесь на «Настройку датчиков Safety Sense» и спросите цену при записи. Если таких функций нет — этот шаг просто отметьте.</p></div>';
  b += '<div class="stack">' + DEALERS.map(d => '<div class="card"><h3>' + esc(d.name) + '</h3><div class="phones">' + d.phones.map(p => phoneRow(p, '')).join('') + '</div><p class="small muted">' + esc(d.addr) + (d.hours ? ' · ' + esc(d.hours) : '') + '</p></div>').join('') + '</div>';
  return stepShell(7, b, {lead:'Последний шаг. После него машина снова целая и всё работает как раньше.'});
}

function finish(){
  const ch = S.choice && findOffer(S.choice), t = ch ? total(ch) : null;
  let h = '<div class="topbar"><button class="btn quiet" data-act="go" data-to="home">← К дороге</button><span></span></div>';
  h += '<div class="card accent"><p class="eyebrow">Финиш</p><p class="big-win">Ура! Машина снова целая</p>' + stars() +
    '<p>Пройдено шагов: ' + doneCount() + ' из 7. Звонков сделано: ' + Object.values(S.calls).filter(c => c.status).length + '.</p>';
  if(ch && t){
    h += '<p>Ваш выбор: <strong>' + esc(ch.seller) + '</strong>, всего ≈ <strong>' + rangeTxt(t) + ' BYN</strong> (' + usd(t.min) + ').</p>';
    h += '<p class="small muted">Для сравнения: первый найденный бампер стоил ' + fmt(BASELINE) + ' BYN только за деталь, без покраски и доставки.</p>';
  }
  h += '</div>' + reportBlock();
  return h;
}

/* ---------- Отрисовка ---------- */
function render(){
  const v = S.screen;
  let h;
  if(v === 'home') h = home();
  else if(v === 'finish') h = finish();
  else h = [null, s1, s2, s3, s4, s5, s6, s7][+v] ? [null, s1, s2, s3, s4, s5, s6, s7][+v]() : home();
  $('#app').innerHTML = h;
}
function go(to){
  S.screen = String(to); U.confirmReset = false; U.confirmDel = null; U.showAdd = false;
  save(); render(); window.scrollTo(0, 0);
}

/* ---------- События ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const a = el.dataset.act;
  if(a === 'tg'){ el.href = tgLink(); return; }
  if(a === 'copy'){ copyText(el.dataset.text || ''); return; }
  if(a === 'copyreport'){ copyText('Бампер RAV4 — отчёт от ' + new Date().toLocaleDateString('ru-RU') + '\n' + report()); return; }
  if(a === 'go'){ go(el.dataset.to); return; }
  if(a === 'next'){
    const n = +el.dataset.n; const first = !S.done[n]; S.done[n] = true;
    if(n === 7){ S.finished = true; go('finish'); confetti(); return; }
    go(n + 1); if(first) toast('Шаг ' + n + ' пройден! Звёздочка ваша');
    return;
  }
  if(a === 'set'){ S[el.dataset.key] = el.dataset.v; save(); render(); return; }
  if(a === 'route'){ S.route = el.dataset.v; S.filter = 'mine'; save(); render(); toast('Путь выбран'); return; }
  if(a === 'filter'){ S.filter = el.dataset.v; save(); render(); return; }
  if(a === 'call'){
    const id = el.dataset.id, c = S.calls[id] || {};
    c.status = c.status === el.dataset.v ? null : el.dataset.v; S.calls[id] = c; save(); render();
    if(c.status === 'yes') toast('Нашёлся! Проверьте цену и цвет');
    return;
  }
  if(a === 'color'){ const c = S.calls[el.dataset.id] || {}; c.color = el.dataset.v; S.calls[el.dataset.id] = c; save(); render(); return; }
  if(a === 'choose'){ S.choice = el.dataset.id; save(); render(); toast('Выбор сохранён'); return; }
  if(a === 'showadd'){ U.showAdd = true; render(); const f = $('#a-seller'); if(f) f.focus(); return; }
  if(a === 'hideadd'){ U.showAdd = false; render(); return; }
  if(a === 'del'){ U.confirmDel = el.dataset.id; render(); return; }
  if(a === 'delno'){ U.confirmDel = null; render(); return; }
  if(a === 'delyes'){ const id = el.dataset.id; S.custom = S.custom.filter(o => o.id !== id); delete S.calls[id]; if(S.choice === id) S.choice = null; U.confirmDel = null; save(); render(); toast('Удалено'); return; }
  if(a === 'reset'){ U.confirmReset = true; render(); return; }
  if(a === 'resetno'){ U.confirmReset = false; render(); return; }
  if(a === 'resetyes'){ S = fresh(); U.confirmReset = false; save(); render(); window.scrollTo(0, 0); toast('Начинаем заново'); return; }
});
document.addEventListener('input', e => {
  const el = e.target, a = el.dataset && el.dataset.act;
  if(!a) return;
  if(a === 'field'){ S[el.dataset.key] = el.value.trim().toUpperCase(); save(); return; }
  if(a === 'price' || a === 'note'){ const c = S.calls[el.dataset.id] || {}; if(a === 'price') c.price = el.value === '' ? null : +el.value; else c.note = el.value; S.calls[el.dataset.id] = c; save(); return; }
  if(a === 'cost'){ S.costs[el.dataset.key] = el.value === '' ? 0 : +el.value; save(); return; }
});
document.addEventListener('change', e => {
  const el = e.target, a = el.dataset && el.dataset.act;
  if(!a) return;
  if(a === 'chk'){ S.checks[el.dataset.key] = el.checked; save(); return; }
  if(a === 'price' || a === 'cost' || a === 'field'){ const y = window.scrollY; render(); window.scrollTo(0, y); }
});
document.addEventListener('submit', e => {
  if(e.target.id !== 'addform') return;
  e.preventDefault();
  const seller = $('#a-seller').value.trim(), phone = $('#a-phone').value.trim();
  if(!seller || !phone){ toast('Впишите продавца и телефон'); return; }
  const price = +$('#a-price').value || null, group = $('#a-group').value, link = $('#a-link').value.trim();
  S.custom.push({id:'c' + Date.now(), custom:true, group, seller, what:GROUPS[group].label, price, phones:[[phone, '']],
    includes:'', holes:{washers:null, pdc:null}, address:'', hours:'', delivery:'', link:/^https?:\/\//.test(link) ? link : ''});
  U.showAdd = false; save(); render(); toast('Вариант добавлен');
});

/* ---------- Конфетти ---------- */
function confetti(){
  try{ if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  const cv = $('#confetti'), ctx = cv.getContext && cv.getContext('2d'); if(!ctx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--mark', '--accent', '--go', '--stop'].map(v => cs.getPropertyValue(v).trim() || '#f2c230');
  const P = Array.from({length:140}, () => ({x:Math.random() * innerWidth, y:-20 - Math.random() * innerHeight * .5, vx:(Math.random() - .5) * 3, vy:2 + Math.random() * 3.5, r:4 + Math.random() * 5, a:Math.random() * 6, va:(Math.random() - .5) * .3, c:cols[(Math.random() * cols.length) | 0]}));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .03; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 3, p.r, p.r * .66); ctx.restore(); });
    if(t - t0 < 3200) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* ---------- Запуск ---------- */
function start(data){
  S = (data && data.S && data.S.v === 1) ? data.S : load();
  render(); renderChat();
  fetch('data.json?t=' + Date.now(), {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(d => {
    if(d && d.offers){ applyData(d); render(); renderChat(); }
  }).catch(() => {});
}

/* ---------- Чат-помощник ---------- */
const CHAT_KEY = 'rav4-bumper-chat-v1';
let CHAT = [];
try{ CHAT = JSON.parse(localStorage.getItem(CHAT_KEY) || '[]') || []; }catch(e){ CHAT = []; }
let chatBusy = false;
function chatSave(){ try{ localStorage.setItem(CHAT_KEY, JSON.stringify(CHAT.slice(-30))); }catch(e){} }
function renderChat(){
  const box = $('#chat'), fab = $('#chat-open');
  if(!box || !fab) return;
  const on = !!DATA.chatEndpoint;
  if(!on){ box.hidden = true; fab.hidden = true; return; }
  fab.hidden = !box.hidden;
  const log = $('#chat-log');
  log.innerHTML = (CHAT.length ? '' : '<div class="msg bot">Здравствуйте! Я знаю всё про ваш бампер: продавцов, цены, номер детали и шаги. Спросите, например: «Что сказать продавцу?» или «Какой вариант дешевле?»</div>') +
    CHAT.map(m => '<div class="msg ' + (m.role === 'user' ? 'me' : 'bot') + '">' + esc(m.content).replace(/\n/g, '<br>') + '</div>').join('') +
    (chatBusy ? '<div class="msg bot">Думаю…</div>' : '');
  log.scrollTop = log.scrollHeight;
}
async function chatSend(text){
  text = (text || '').trim();
  if(!text || chatBusy) return;
  CHAT.push({role:'user', content:text}); chatBusy = true; chatSave(); renderChat();
  let reply = '';
  try{
    const r = await fetch(DATA.chatEndpoint, {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:CHAT.filter(m => !m.err).slice(-12).map(m => ({role:m.role, content:m.content})), state:report()})});
    const j = await r.json().catch(() => ({}));
    reply = j.reply || '';
  }catch(e){}
  CHAT.push(reply ? {role:'assistant', content:reply} : {role:'assistant', content:'Не получилось ответить. Проверьте интернет и попробуйте ещё раз через минуту.', err:true});
  chatBusy = false; chatSave(); renderChat();
}
document.addEventListener('click', e => {
  if(e.target.closest('#chat-open')){ $('#chat').hidden = false; renderChat(); const i = $('#chat-input'); if(i) i.focus(); }
  else if(e.target.closest('#chat-close')){ $('#chat').hidden = true; renderChat(); }
  else if(e.target.closest('#chat-clear')){ CHAT = []; chatSave(); renderChat(); }
});
document.addEventListener('submit', e => {
  if(e.target.id !== 'chat-form') return;
  e.preventDefault(); const i = $('#chat-input'); const v = i.value; i.value = ''; chatSend(v);
});
try{ window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({S})); }catch(e){}
if(window.claude && window.claude.hot && window.claude.hot.ready){ window.claude.hot.ready(start); }
else { start((window.claude && window.claude.hot && window.claude.hot.data) || {}); }
window.__quest = {total, issues, OFFERS, get S(){ return S; }};
})();
</script>
